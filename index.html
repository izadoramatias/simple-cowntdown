<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Será liberado em breve</title>
  <style>
    :root {
      --bg: #fff6fa;
      --card: rgba(255, 255, 255, 0.85);
      --primary: #d96f93;
      --text: #6b3b4c;
      --muted: #9a6a7b;
      --shadow: 0 16px 36px rgba(217, 111, 147, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, #ffe9f2 0%, transparent 42%),
        radial-gradient(circle at 80% 10%, #ffeef7 0%, transparent 35%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    .heart-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -60px;
      width: 20px;
      height: 20px;
      background: rgba(255, 170, 196, 0.55);
      transform: rotate(45deg);
      animation: rise linear infinite;
      filter: blur(0.2px);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: inherit;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: -10px;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) rotate(45deg) scale(0.7);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-115vh) rotate(45deg) scale(1.05);
        opacity: 0;
      }
    }

    @keyframes laneMove {
      from {
        transform: translate(-58px, -50%);
      }
      to {
        transform: translate(0, -50%);
      }
    }

    @keyframes truckDrive {
      0% {
        left: -130px;
        bottom: 43px;
        transform: translateY(0);
      }
      50% {
        transform: translateY(-1px);
      }
      100% {
        left: calc(100% + 20px);
        bottom: 43px;
        transform: translateY(0);
      }
    }

    @keyframes wheelSpin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .container {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid rgba(255, 193, 215, 0.55);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      padding: 28px 24px;
      position: relative;
      z-index: 1;
    }

    h1 {
      text-align: center;
      font-size: clamp(1.75rem, 3.5vw, 2.5rem);
      color: var(--primary);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 22px;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      font-weight: 500;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, minmax(70px, 1fr));
      gap: 12px;
      margin-bottom: 10px;
    }

    .time-box {
      text-align: center;
      background: #fff;
      border-radius: 18px;
      padding: 14px 10px;
      border: 1px solid #ffd6e6;
    }

    .time-value {
      display: block;
      font-size: clamp(1.3rem, 4.5vw, 2.25rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .time-label {
      display: block;
      margin-top: 6px;
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
    }

    .road-scene {
      position: relative;
      height: 116px;
      margin: 18px 0 14px;
      border-radius: 18px;
      border: 1px solid #ffd6e6;
      background: linear-gradient(180deg, #ffeef7 0 46%, #f6bfd6 46% 100%);
      overflow: hidden;
    }

    .road {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42px;
      background: #cc8aa8;
    }

    .road::before {
      content: "";
      position: absolute;
      top: 50%;
      left: -120px;
      width: calc(100% + 240px);
      height: 4px;
      transform: translateY(-50%);
      background: repeating-linear-gradient(90deg, #fff 0 34px, transparent 34px 58px);
      animation: laneMove 2.4s linear infinite;
      opacity: 0.9;
    }

    .truck {
      position: absolute;
      left: -130px;
      width: 112px;
      height: 36px;
      animation: truckDrive 8.5s linear infinite;
      z-index: 2;
    }

    .truck-body {
      position: absolute;
      bottom: 8px;
      left: 0;
      width: 70px;
      height: 20px;
      border-radius: 6px;
      background: #ff9fc1;
      border: 1px solid #e57ea5;
    }

    .truck-cabin {
      position: absolute;
      bottom: 8px;
      left: 68px;
      width: 32px;
      height: 20px;
      border-radius: 6px 8px 6px 4px;
      background: #ffd4e5;
      border: 1px solid #e59bb9;
    }

    .wheel {
      position: absolute;
      bottom: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #74465a;
      border: 2px solid #f9d3e2;
      animation: wheelSpin 0.8s linear infinite;
    }

    .wheel.left {
      left: 15px;
    }

    .wheel.center {
      left: 46px;
    }

    .wheel.right {
      left: 79px;
    }

    .logistics-note {
      text-align: center;
      margin: 0 0 10px;
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.5;
      font-weight: 500;
    }

    .target-date-note {
      text-align: center;
      margin-top: 6px;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .status {
      text-align: center;
      min-height: 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status.done {
      color: #b54d71;
      font-weight: 600;
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .container {
        padding: 18px;
        border-radius: 22px;
      }

      .timer {
        gap: 8px;
      }

      .time-box {
        border-radius: 14px;
        padding: 11px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="heart-layer" id="heartLayer" aria-hidden="true"></div>

  <main class="container" role="main">
    <h1>Data confirmada 🥳</h1>
    <p class="subtitle">Já temos uma previsão e a contagem regressiva começou! acompanhe a pagina diariamente para não perder nada.</p>

    <section class="timer" aria-label="Contagem regressiva">
      <article class="time-box">
        <span class="time-value" id="days">00</span>
        <span class="time-label">Dias</span>
      </article>
      <article class="time-box">
        <span class="time-value" id="hours">00</span>
        <span class="time-label">Horas</span>
      </article>
      <article class="time-box">
        <span class="time-value" id="minutes">00</span>
        <span class="time-label">Minutos</span>
      </article>
      <article class="time-box">
        <span class="time-value" id="seconds">00</span>
        <span class="time-label">Segundos</span>
      </article>
    </section>

    <p class="target-date-note" id="targetDateText"></p>


    <section class="road-scene" aria-label="Logística em andamento">
      <div class="truck" aria-hidden="true">
        <span class="truck-body"></span>
        <span class="truck-cabin"></span>
        <span class="wheel left"></span>
        <span class="wheel center"></span>
        <span class="wheel right"></span>
      </div>
      <div class="road"></div>
    </section>

    <p class="logistics-note">A equipe de logística está trabalhando para a entrega do seu pacote em Tão Tão Distante. Beba uma água enquanto aguarda.</p>
  </main>

  <script>
    (function () {
      const ids = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds"),
        statusText: document.getElementById("statusText"),
        targetDateText: document.getElementById("targetDateText"),
        heartLayer: document.getElementById("heartLayer")
      };

      let targetDate = null;
      let timer = null;

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function setClock(days, hours, minutes, seconds) {
        ids.days.textContent = pad(days);
        ids.hours.textContent = pad(hours);
        ids.minutes.textContent = pad(minutes);
        ids.seconds.textContent = pad(seconds);
      }

      function resetClock() {
        setClock(0, 0, 0, 0);
      }

      function renderStatus(message, done = false) {
        ids.statusText.textContent = message;
        ids.statusText.classList.toggle("done", done);
      }

      async function loadCountdownEnabled() {
        try {
          const response = await fetch("./config.json", { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Falha ao ler config.json (HTTP ${response.status})`);
          }

          const data = await response.json();
          return data?.countdown?.enabled !== false;
        } catch (error) {
          console.error("Erro ao carregar config.json:", error);
          return true;
        }
      }

      function getTodayKey() {
        const now = new Date();
        const year = now.getFullYear();
        const month = pad(now.getMonth() + 1);
        const day = pad(now.getDate());
        return `${year}-${month}-${day}`;
      }

      function createDailyRandomTargetDate() {
        const now = new Date();
        const startDay = new Date(now);
        startDay.setHours(0, 0, 0, 0);

        const maxDay = new Date(startDay);
        maxDay.setMonth(maxDay.getMonth() + 2);

        const msPerDay = 24 * 60 * 60 * 1000;
        const totalDays = Math.floor((maxDay.getTime() - startDay.getTime()) / msPerDay);
        const randomOffset = Math.floor(Math.random() * (totalDays + 1));

        const target = new Date(startDay);
        target.setDate(target.getDate() + randomOffset);
        target.setHours(23, 59, 59, 999);

        return target;
      }

      function getDailyRandomTargetDate() {
        const todayKey = getTodayKey();
        const storedDayKey = localStorage.getItem("countdown_day_key");
        const storedTargetIso = localStorage.getItem("countdown_target_iso");

        if (storedDayKey === todayKey && storedTargetIso) {
          const storedTarget = new Date(storedTargetIso);
          if (!Number.isNaN(storedTarget.getTime())) {
            return storedTarget;
          }
        }

        const newTarget = createDailyRandomTargetDate();
        localStorage.setItem("countdown_day_key", todayKey);
        localStorage.setItem("countdown_target_iso", newTarget.toISOString());
        return newTarget;
      }

      function renderTargetDate() {
        if (!targetDate) {
          ids.targetDateText.textContent = "";
          return;
        }

        ids.targetDateText.textContent = `${targetDate.toLocaleDateString("pt-BR")}`;
      }

      function updateCountdown() {
        if (!targetDate) {
          resetClock();
          renderStatus("Rufem os tambores.");
          return;
        }

        const now = new Date();
        const diff = targetDate.getTime() - now.getTime();

        if (diff <= 0) {
          resetClock();
          renderStatus("Chegou a hora! ✨", true);
          clearInterval(timer);
          return;
        }

        const totalSeconds = Math.floor(diff / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        setClock(days, hours, minutes, seconds);
        renderStatus("");
      }

      function startTimer() {
        if (timer) clearInterval(timer);
        renderTargetDate();
        updateCountdown();
        timer = setInterval(updateCountdown, 1000);
      }

      function createHeart() {
        const heart = document.createElement("span");
        heart.className = "heart";

        const size = Math.random() * 16 + 10;
        const left = Math.random() * 100;
        const duration = Math.random() * 10 + 12;
        const delay = Math.random() * 3;
        const opacity = Math.random() * 0.35 + 0.2;

        heart.style.width = `${size}px`;
        heart.style.height = `${size}px`;
        heart.style.left = `${left}%`;
        heart.style.animationDuration = `${duration}s`;
        heart.style.animationDelay = `${delay}s`;
        heart.style.opacity = String(opacity);

        ids.heartLayer.appendChild(heart);
        setTimeout(() => heart.remove(), (duration + delay) * 1000 + 200);
      }

      function startHearts() {
        for (let i = 0; i < 8; i++) {
          setTimeout(createHeart, i * 500);
        }
        setInterval(createHeart, 2200);
      }

      async function initialize() {
        resetClock();
        startHearts();

        const isEnabled = await loadCountdownEnabled();
        targetDate = isEnabled ? getDailyRandomTargetDate() : null;
        startTimer();
      }

      initialize();
    })();
  </script>
</body>
</html>
